<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Persahabatan 💕</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      overflow: hidden;
    }

    /* bunga background */
    .flower {
      position: absolute;
      font-size: 24px;
      animation: fall 10s linear infinite;
      opacity: 0.7;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh); }
      100% { transform: translateY(110vh); }
    }

    .container {
      margin-top: 80px;
      background: rgba(255,255,255,0.8);
      padding: 30px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .cat {
      width: 120px;
    }

    h1 {
      color: #ff4d88;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yesBtn {
      background-color: #ff66a3;
      color: white;
    }

    #noBtn {
      background-color: #ccc;
    }

    button:hover {
      transform: scale(1.1);
    }

    #message {
      margin-top: 20px;
      font-size: 18px;
      color: #ff3385;
      display: none;
    }
  </style>
</head>
<body>

  <!-- bunga jatuh -->
  <script>
    for (let i = 0; i < 20; i++) {
      let flower = document.createElement("div");
      flower.className = "flower";
      flower.innerHTML = "🌸";
      flower.style.left = Math.random() * 100 + "vw";
      flower.style.animationDuration = (5 + Math.random() * 5) + "s";
      document.body.appendChild(flower);
    }
  </script>

  <div class="container">
    <!-- logo kucing -->
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" class="cat" alt="kucing">

    <h1>Mau jadi sahabatku? 🥺</h1>

    <button id="yesBtn">Mau 💕</button>
    <button id="noBtn">Tidak 😢</button>

    <div id="message"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");

    yesBtn.onclick = function() {
      message.style.display = "block";
      message.innerHTML = "Yay! Kita sahabatan sekarang! 🐱💖";
    }

    noBtn.onmouseover = function() {
      noBtn.style.position = "absolute";
      noBtn.style.top = Math.random() * 80 + "vh";
      noBtn.style.left = Math.random() * 80 + "vw";
    }
  </script>

</body>
</html>
